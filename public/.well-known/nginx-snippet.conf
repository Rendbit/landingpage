# The live site answers with `Server: nginx`, so whichever nginx serves
# rendbit.com needs this block. Without it the SPA catch-all returns
# index.html for these paths, and both Apple and Google reject the HTML
# silently: saved passwords simply never get offered, with no error anywhere.
#
# Place ABOVE the `location /` SPA block, since nginx takes the most specific
# match but exact-prefix ordering still matters against a regex catch-all.

location = /.well-known/apple-app-site-association {
    # No .json extension on this one. That is Apple's requirement, and it is
    # why the type has to be set by hand rather than guessed from the name.
    default_type application/json;
    root /var/www/rendbit;          # adjust to the site root
    try_files /.well-known/apple-app-site-association =404;
}

location = /.well-known/assetlinks.json {
    default_type application/json;
    root /var/www/rendbit;          # adjust to the site root
    try_files /.well-known/assetlinks.json =404;
}
